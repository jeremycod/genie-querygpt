[package]
name = "querygpt-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "querygpt"
path = "src/main.rs"

[dependencies]
querygpt-core = { path = "../querygpt-core" }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"